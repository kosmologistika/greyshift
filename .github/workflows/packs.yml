# Every pack's module and the template build against the published SDK in
# sdk/, so a pull request that uses a type the engine does not grant fails
# here with the type named
name: packs
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build every pack and the template
        run: |
          set -e
          shopt -s nullglob
          for project in packs/*/*.csproj template/*.csproj; do
            echo "== $project"
            dotnet build "$project" -c Release
          done
